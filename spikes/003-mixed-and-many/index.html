<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike 003 · mixed skins and many characters</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #14151a; color: #e8e6df; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      canvas { display: block; width: 960px; height: 540px; margin: 0 16px; background: #f2f0e9; border-radius: 6px; }
      .row { display: flex; gap: 6px; align-items: center; }
      button { background: #24262e; color: inherit; border: 1px solid #3a3d48; border-radius: 5px; padding: 3px 9px; font: inherit; cursor: pointer; }
      button[aria-pressed='true'] { background: #3a4a2a; border-color: #6c8f45; }
      #readout { padding: 10px 16px 20px; color: #9ea2ad; }
      b { color: #e8e6df; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <span><b>spike 003</b> · mixed skins, many characters</span>
      <span class="row" id="counts"></span>
      <span class="row">
        <button id="mixed" aria-pressed="true">mixed skins</button>
        <button id="single" aria-pressed="false">one skin</button>
      </span>
    </header>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="readout"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
