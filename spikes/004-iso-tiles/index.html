<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike 004 · an isometric tile room in three.js</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #14151a; color: #e8e6df; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
      .row { display: flex; gap: 6px; align-items: center; }
      button, select { background: #24262e; color: inherit; border: 1px solid #3a3d48; border-radius: 5px; padding: 3px 9px; font: inherit; cursor: pointer; }
      button[aria-pressed='true'] { background: #3a4a2a; border-color: #6c8f45; }
      #scrub { width: 220px; }
      #view { position: relative; width: calc(100vw - 32px); height: calc(100vh - 120px); margin: 0 16px; border-radius: 6px; overflow: hidden; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #bubbles { position: absolute; inset: 0; pointer-events: none; }
      .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 240px; background: #fffdf6; color: #1b1b1b; border-radius: 10px; padding: 5px 9px; font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; box-shadow: 0 2px 6px #0006; }
      .bubble b { display: block; font-size: 11px; color: #7a6a52; font-weight: 600; }
      #card { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); padding: 10px 22px; background: #000c; color: #fff; letter-spacing: 0.2em; border-radius: 4px; }
      #readout { padding: 8px 16px; color: #9ea2ad; }
      #life { position: absolute; top: 8px; right: 8px; bottom: 8px; width: 300px; overflow-y: auto; background: #14151add; border: 1px solid #2c2f38; border-radius: 6px; padding: 8px 10px; font-size: 12px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
      #life[hidden] { display: none; }
      #life .status { color: #9ea2ad; }
      #life .cast { display: flex; flex-wrap: wrap; gap: 4px; }
      #life .cast button, #life .pokes button { font-size: 11px; padding: 2px 6px; }
      #life .who { font-size: 15px; font-weight: 600; }
      #life .intent { color: #e8d9a8; }
      #life .bar { display: grid; grid-template-columns: 74px 1fr 92px; gap: 6px; align-items: center; }
      #life .track { height: 7px; background: #2a2c34; border-radius: 4px; overflow: hidden; }
      #life .track i { display: block; height: 100%; background: linear-gradient(90deg, #6c8f45, #d9a441, #c4533a); transition: width 0.3s; }
      #life .v { color: #9ea2ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #life .net { width: 100%; height: 170px; flex: none; background: #0e0f13; border-radius: 4px; }
      #life .net text { fill: #9ea2ad; font-size: 8px; font-family: inherit; }
      #life .story { margin: 0; padding-left: 0; list-style: none; color: #c9c6bd; }
      #life .dim { color: #7c808b; }
      .tags { position: absolute; inset: 0; pointer-events: none; }
      .tag { position: absolute; transform: translate(-50%, 6px); font-size: 10px; color: #e8e6df; background: #000a; padding: 0 5px; border-radius: 3px; white-space: nowrap; }
      .tag.on { background: #6c8f45; }
      b { color: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <span><b>spike 004</b> · iso tiles</span>
      <select id="show">
        <option value="shadow">the shadow (a written scene, 36×28)</option>
        <option value="life">life (five minds, live in the engine)</option>
        <option value="lab">lab (walks)</option>
        <option value="duet">duet</option>
        <option value="troupe">troupe</option>
      </select>
      <span class="row">
        <button id="play">pause</button>
        <button id="restart">restart</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </span>
      <span class="row">
        <button data-look="show" aria-pressed="true">as written</button>
        <button data-look="maxcot" aria-pressed="false">maxcot</button>
        <button data-look="mixed" aria-pressed="false">mixed</button>
        <button data-look="model" aria-pressed="false">models</button>
      </span>
      <button id="whole">whole room</button>
      <button id="wander">wander</button>
    </header>
    <div id="view">
      <div id="bubbles"></div>
      <div id="card" hidden></div>
      <aside id="life" hidden></aside>
    </div>
    <div id="readout"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
